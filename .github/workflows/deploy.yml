name: Deploy VRC Asset Release and Listing Upload
on:
  workflow_dispatch:
    inputs:
      CHANGELOG:
        required: true
        type: string
        description: Changelog for the release. Use '\\n' for new lines.

permissions:
  contents: write

env:
  UPLOAD_ENDPOINT: null
  ARTIFACT_DURATION: 30
  RELEASE_PATH: Packages

jobs:
  deploy:
    runs-on: "ubuntu-latest"
    steps:          
      - name: Checkout code repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.REPOSITORY }}
          path: ./Checkout
          
      - name: Check if package.json exists
        run: |
          cd ./Checkout/${{ inputs.ASSETS_PATH }}
          if [ ! -f package.json ]; then
            echo "package.json not found"
            exit 1
          fi
          cd -

      - name: Get package.json
        id: get_package_json
        run: |
          cd ./Checkout/${{ inputs.ASSETS_PATH }}
          {
            echo 'package_json<<"""'
            echo $(cat package.json)
            echo '"""'
          } >> $GITHUB_OUTPUT
          cd -

      - name: Get needed Data
        id: job_data
        run: |
          version="${{ fromJson(steps.get_package_json.outputs.package_json).version }}"
          name="${{ fromJson(steps.get_package_json.outputs.package_json).name }}"
          display_name="${{ fromJson(steps.get_package_json.outputs.package_json).displayName }}"
          echo "package_name=$name" >> $GITHUB_OUTPUT
          echo "package_display_name=$display_name" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create Packages
        id: create_packages
        uses: VRLabs/VRCTools-Packaging-Action@v1
        with:
          path: './Checkout/${{ inputs.ASSETS_PATH }}'
          outputPath: '${{ env.RELEASE_PATH }}'
          releaseUrl: 'https://github.com/${{ github.REPOSITORY }}/releases/download/${{ steps.job_data.outputs.version }}/${{ steps.job_data.outputs.package_name }}-${{ steps.job_data.outputs.version }}.zip'
          unityReleaseUrl: 'https://github.com/${{ github.REPOSITORY }}/releases/download/${{ steps.job_data.outputs.version }}/${{ steps.job_data.outputs.package_name }}-${{ steps.job_data.outputs.version }}.unitypackage'
          releaseVersion: '${{ steps.job_data.outputs.version }}'
          customJsonFields: "changelogUrl=https://github.com/${{ github.REPOSITORY }}/releases/tag/${{ steps.job_data.outputs.version }}"

      - name: Create tag
        run: |
          cd ./Checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.job_data.outputs.version }}"
          git push origin "${{ steps.job_data.outputs.version }}"
          cd -
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Changelog
        run: |
          CHANGELOG_ESCAPED="${{ inputs.CHANGELOG }}" # Capture the input
          CHANGELOG_ESCAPED="${CHANGELOG_ESCAPED//\'/\\\'}" # Escape single quotes
          echo -e "$CHANGELOG_ESCAPED" > CHANGELOG

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.job_data.outputs.package_display_name }} ${{ steps.job_data.outputs.version }}"
          body_path: CHANGELOG
          files: |
            ${{ steps.create_packages.outputs.unityPackagePath }}
            ${{ steps.create_packages.outputs.vccPackagePath }}
            ${{ steps.create_packages.outputs.serverPackageJsonPath }}
          repository: ${{ github.REPOSITORY }}
          tag_name: ${{ steps.job_data.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ steps.job_data.outputs.version }}
        
      - name: Add server-json to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-json
          path: ${{ steps.create_packages.outputs.serverPackageJsonPath }}
          retention-days: ${{ env.ARTIFACT_DURATION }} 

      - name: Checkout Index Repo
        uses: actions/checkout@v4
        with:
          repository: 'vrcd-community/vpm-index'
          token: ${{ secrets.INDEX_REPO_PAT }}
          path: ./IndexRepo

      - name: Update VPM index.json
        run: |
          python3 -c '
          import json
          import os

          pkg_json_path = "./Checkout/${{ inputs.ASSETS_PATH }}/package.json"
          server_json_path = "${{ steps.create_packages.outputs.serverPackageJsonPath }}"
          index_json_path = "./IndexRepo/index.json"

          with open(pkg_json_path, "r", encoding="utf-8") as f:
              pkg_data = json.load(f)

          with open(server_json_path, "r", encoding="utf-8") as f:
              server_data = json.load(f)

          with open(index_json_path, "r", encoding="utf-8") as f:
              index_data = json.load(f)

          version_str = server_data.get("version")

          new_version_info = {
              "name": server_data.get("name"),
              "displayName": server_data.get("displayName"),
              "version": version_str,
              "author": server_data.get("author"),
              "unity": server_data.get("unity"),
              "description": server_data.get("description"),
              "url": server_data.get("url"),
              "zipSHA256": server_data.get("zipSHA256")
          }

          if "vpmDependencies" in pkg_data:
              new_version_info["vpmDependencies"] = pkg_data["vpmDependencies"]
          elif "dependencies" in server_data:
              new_version_info["vpmDependencies"] = server_data["dependencies"]
          else:
              new_version_info["vpmDependencies"] = {}

          for legacy_key in ["legacyFolders", "legacyFiles", "legacyPackages"]:
              if legacy_key in pkg_data:
                  new_version_info[legacy_key] = pkg_data[legacy_key]

          pkg_name = new_version_info["name"]

          if "packages" not in index_data:
              index_data["packages"] = {}

          if pkg_name not in index_data["packages"]:
              index_data["packages"][pkg_name] = {"versions": {}}

          index_data["packages"][pkg_name]["versions"][version_str] = new_version_info

          with open(index_json_path, "w", encoding="utf-8") as f:
              json.dump(index_data, f, indent=2, ensure_ascii=False)
          print("Successfully integrated package data into index.json")
          '

      - name: Push index.json to Index Repo
        run: |
          cd ./IndexRepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update VPM version ${{ steps.job_data.outputs.version }} for ${{ steps.job_data.outputs.package_name }}" && git push)
