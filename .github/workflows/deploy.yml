name: Deploy VRC Asset Release and Listing Upload
on:
  workflow_dispatch:
    inputs:
      CHANGELOG:
        required: true
        type: string
        description: Changelog for the release. Use '\\n' for new lines.

permissions:
  contents: write

env:
  UPLOAD_ENDPOINT: null
  ARTIFACT_DURATION: 30
  RELEASE_PATH: Packages

jobs:
  deploy:
    runs-on: "ubuntu-latest"
    steps:          
      - name: Checkout code repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.REPOSITORY }}
          path: ./Checkout
          
      - name: Check if package.json exists
        run: |
          cd ./Checkout/${{ inputs.ASSETS_PATH }}
          if [ ! -f package.json ]; then
            echo "package.json not found"
            exit 1
          fi
          cd -

      - name: Get package.json
        id: get_package_json
        run: |
          cd ./Checkout/${{ inputs.ASSETS_PATH }}
          {
            echo 'package_json<<"""'
            echo $(cat package.json)
            echo '"""'
          } >> $GITHUB_OUTPUT
          cd -

      - name: Get needed Data
        id: job_data
        run: |
          version="${{ fromJson(steps.get_package_json.outputs.package_json).version }}"
          name="${{ fromJson(steps.get_package_json.outputs.package_json).name }}"
          display_name="${{ fromJson(steps.get_package_json.outputs.package_json).displayName }}"
          echo "package_name=$name" >> $GITHUB_OUTPUT
          echo "package_display_name=$display_name" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create Packages
        id: create_packages
        uses: VRLabs/VRCTools-Packaging-Action@v1
        with:
          path: './Checkout/${{ inputs.ASSETS_PATH }}'
          outputPath: '${{ env.RELEASE_PATH }}'
          releaseUrl: 'https://github.com/${{ github.REPOSITORY }}/releases/download/${{ steps.job_data.outputs.version }}/${{ steps.job_data.outputs.package_name }}-${{ steps.job_data.outputs.version }}.zip'
          unityReleaseUrl: 'https://github.com/${{ github.REPOSITORY }}/releases/download/${{ steps.job_data.outputs.version }}/${{ steps.job_data.outputs.package_name }}-${{ steps.job_data.outputs.version }}.unitypackage'
          releaseVersion: '${{ steps.job_data.outputs.version }}'
          customJsonFields: "changelogUrl=https://github.com/${{ github.REPOSITORY }}/releases/tag/${{ steps.job_data.outputs.version }}"

      - name: Create tag
        run: |
          cd ./Checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.job_data.outputs.version }}"
          git push origin "${{ steps.job_data.outputs.version }}"
          cd -
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Changelog
        run: |
          CHANGELOG_ESCAPED="${{ inputs.CHANGELOG }}" # Capture the input
          CHANGELOG_ESCAPED="${CHANGELOG_ESCAPED//\'/\\\'}" # Escape single quotes
          echo -e "$CHANGELOG_ESCAPED" > CHANGELOG

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.job_data.outputs.package_display_name }} ${{ steps.job_data.outputs.version }}"
          body_path: CHANGELOG
          files: |
            ${{ steps.create_packages.outputs.unityPackagePath }}
            ${{ steps.create_packages.outputs.vccPackagePath }}
            ${{ steps.create_packages.outputs.serverPackageJsonPath }}
          repository: ${{ github.REPOSITORY }}
          tag_name: ${{ steps.job_data.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ steps.job_data.outputs.version }}
        
      - name: Add server-json to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-json
          path: ${{ steps.create_packages.outputs.serverPackageJsonPath }}
          retention-days: ${{ env.ARTIFACT_DURATION }} 

      # - name: Send package info to a server
      #   run: |
      #     curl -X POST -H "Content-Type: application/json" -H "Api-Key: ${{ secrets.LISTINGS_API_KEY }}" --data @${{ steps.create_packages.outputs.serverPackageJsonPath }} ${{ env.UPLOAD_ENDPOINT }} || exit 0
      #   shell: bash
