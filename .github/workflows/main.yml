name: Build And Publish VPM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      PACKAGE_NAME: com.wangqaq.test
      PACKAGE_PATH: Packages/com.wangqaq.test
      OUTPUT_DIR: BuildOutput

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Output
        run: mkdir ${{ env.OUTPUT_DIR }}

      - name: Build Package
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"

          $zipUrl = "https://github.com/$repo/releases/download/$tag/${{ env.PACKAGE_NAME }}.zip"
          $unityUrl = "https://github.com/$repo/releases/download/$tag/${{ env.PACKAGE_NAME }}.unitypackage"

          ./Tools/VRCPackagingTool.exe `
            "${{ env.PACKAGE_PATH }}" `
            "${{ env.OUTPUT_DIR }}" `
            --releaseUrl "$zipUrl" `
            --unityReleaseUrl "$unityUrl" `
            --releaseVersion "$version" `
            --action

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            BuildOutput/*
